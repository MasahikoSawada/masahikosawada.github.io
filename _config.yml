# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: MasahikoSawada
email: sawada.mshk@gmail.com
tagline: "PostgreSQLの内部構造を解説するブログ"
description: >-
  PostgreSQLメジャーコントリビュータ／コミッタ Masahiko Sawada のブログ。
  VACUUM、MVCC、論理レプリケーション、トランザクション管理、インデックスなど
  PostgreSQL の内部構造とソースコードを日本語で解説しています。
author:
  name: Masahiko Sawada
  twitter: masahiko_sawada
url: "https://masahikosawada.github.io" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: masahiko_sawada
github_username:  MasahikoSawada
linkedin_username: masahikosawada

# Consumed by jekyll-seo-tag: Twitter card type and the Person/sameAs it emits.
twitter:
  username: masahiko_sawada
  card: summary_large_image
social:
  name: Masahiko Sawada
  links:
    - https://github.com/MasahikoSawada
    - https://x.com/masahiko_sawada
    - https://www.linkedin.com/in/masahikosawada
logo: /assets/images/og-default.png
lang: ja
locale: ja_JP
timezone: Asia/Tokyo

# Measurement. Both are read by _includes/google-analytics.html and jekyll-seo-tag.
# The GA4 tag only renders when JEKYLL_ENV is production, so local serves are not counted.
google_analytics: G-WRE0D2HZJD
# Fill in once the Search Console property is verified (HTML tag method, content value only).
#webmaster_verifications:
#  google: XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-archives
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-polyglot

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      image: /assets/images/og-default.png
  # site.locale would otherwise win over the page language in jekyll-seo-tag's
  # page_locale (page.locale || site.locale || page_lang), stamping ja_JP on the
  # English posts too. Polyglot re-renders the Japanese documents under /en/ as
  # well, but those keep their own path and so stay ja_JP, which is right: the
  # body is still Japanese.
  - scope:
      path: "_posts/en"
    values:
      locale: en_US
  - scope:
      path: "_drafts/en"
    values:
      locale: en_US
  - scope:
      path: ""
    values:
      image: /assets/images/og-default.png
  - scope:
      path: "tag"
      type: "pages"
    values:
      noindex: true

permalink: /:year/:month/:day/:title/
paginate_path: /posts/:num/
paginate: 5

languages: ["ja", "en"]
default_lang: "ja"
exclude_from_localization: ["assets/css", "assets/img"]
parallel_localization: true

#jekyll-archives:
#  enabled:
#    - tags
#  layout: tags_archives
#  permalinks:
#    tag: /tags/:name/

