---
layout: default
---
<div class="post">
<h1>Tag: {{ page.tag }}</h1>
<ul class="post-archives">
{%- for post in site.tags[page.tag] %}
  <li>
    <a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a>
    <span class="post-meta">({{ post.date | date: "%Y/%m/%d" }})</span>
    {%- if post.description %}
    <br>{{ post.description | strip_html | normalize_whitespace | truncate: 120 }}
    {%- endif %}
  </li>
{%- endfor %}
</ul>
</div>
